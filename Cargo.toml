[package]
name = "bevy_mod_scripting_qcvm"
version = "0.5.0"
edition = "2024"
description = "A QuakeC runtime for scripting Bevy games"
readme = "README.md"

authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[workspace]
members = ["crates/qcvm", "crates/qcvm-defs-quake1", "crates/qcvm-defs-csqc"]

[workspace.package]
authors = ["Eira Fransham <eira.fransham@gmail.com>"]
# Needs to be licensed under GPL to be compatible with Quake 1's license.
license = "GPL-2.0"
homepage = "https://github.com/eira-fransham/bevy_mod_scripting_qcvm"
repository = "https://github.com/eira-fransham/bevy_mod_scripting_qcvm"

[workspace.dependencies]
anyhow = "1.0"
arc-slice = "0.1" 
arrayvec = "0.7"
bimap = "0.6"
bitflags = "2.10"
bump-scope = "1.4"
byteorder = "1.5"
hash32 = "1.0"
hashbrown = "0.16"
gxhash = "3.5"
glam = "0.33"
indexmap = "2.11"
itertools = "0.14"
num = "0.4"
num-traits = "0.2"
num-derive = "0.4"
parking_lot = "0.12"
snafu = "0.8"
strum = "0.27" 
tracing = "^0.1"

bevy_reflect = "0.20"

[dependencies]
hashbrown.workspace = true
itertools.workspace = true
num.workspace = true
parking_lot.workspace = true
bevy_reflect.workspace = true
qcvm = { version = "0.5", path = "crates/qcvm" }

bevy_ecs = "0.20"
bevy_asset = "0.20"
bevy_app = "0.20"
bevy_log = "0.20"
bevy_math = "0.20"
bevy_platform = "0.20"

bevy_mod_scripting_core = "0.24"
bevy_mod_scripting_script = "0.24"
bevy_mod_scripting_display = "0.24"
bevy_mod_scripting_bindings = "0.24"
bevy_mod_scripting_asset = "0.24"
bevy_mod_scripting_world = "0.24"

[features]
default = []
